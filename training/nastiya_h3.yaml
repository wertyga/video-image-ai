# nastiya для MiniMax H3 (fl2va pruned, как в workflows/h3_nsfw_server.json): LoRA персонажа на картинках.
# Датасет images_h3 = картинки images_v3 с подписями в формате MiniMax (integrated_multimodal_description / N/A / N/A),
# videos_h3 = ролики по 3 с из тех же картинок (scripts/make_video_dataset.py).
# Сервер 48GB с профилем h3-server. ComfyUI остановить. Первый запуск H3-обучения, не проверен.
# Запуск: ./scripts/train_lora.sh training/nastiya_h3.yaml
job: extension
config:
  name: "nastiya_h3"
  process:
    - type: "sd_trainer"
      training_folder: "output"   # внутри ai-toolkit/
      device: cuda:0
      trigger_word: "nst woman"
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: bf16
        save_every: 250
        max_step_saves_to_keep: 10
      datasets:
        - folder_path: "../datasets/nastiya/images_h3"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768]   # если влезает по памяти — добавить 1024
        # ролики из scripts/make_video_dataset.py; если папки ещё нет — закомментировать этот блок
        - folder_path: "../datasets/nastiya/videos_h3"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512]
          num_frames: 41   # 17k+5; при OOM — 22
          fps: 24
          do_audio: false
      train:
        batch_size: 1
        cache_text_embeddings: true   # энкодер 32B выгружается после кэша
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "shift"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        # файлы ищутся в ComfyUI/models (MODELS_PATH задаёт train_lora-скрипт), недостающие докачиваются
        name_or_path: "Comfy-Org/MiniMax-H3"
        arch: "minimax_h3"
        low_vram: true
        model_kwargs:
          partition: "fl2va_pruned"
          # энкодер int8 из h3-server вместо nvfp4 по умолчанию; если падает на загрузке —
          # удалить строку, тренер сам скачает nvfp4 (~20 ГБ)
          text_encoder_path: "../ComfyUI/models/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
          sample_audio: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 512
        height: 768
        num_frames: 1   # пробные кадры картинками, видео проверять в ComfyUI
        prompts:
          - "integrated_multimodal_description: [Shot 1] Live-action, static shot. Photograph of nst woman sitting in a cafe by the window, wearing a grey sweater, soft daylight.\n\noverall_soundscape: N/A\n\nnon_diegetic_music: N/A"
          - "integrated_multimodal_description: [Shot 1] Live-action, static shot. Close-up portrait photograph of nst woman smiling, golden hour backlight, city street behind her.\n\noverall_soundscape: N/A\n\nnon_diegetic_music: N/A"
          - "integrated_multimodal_description: [Shot 1] Live-action, static shot. Full-body photograph of nst woman standing in a bedroom in black lingerie, warm lamp light.\n\noverall_soundscape: N/A\n\nnon_diegetic_music: N/A"
        neg: ""
        seed: 42
        walk_seed: true
        sample_steps: 30
meta:
  name: "[name]"
  version: "1.0"
